query GetClassroomSchedule($room: String) {
  classroom(room: $room) {
    room
    schedule {
      monday {
        slot
        subject {
          name
          code
          type
        }
        teacher {
          name
          code
          email
        }
        room
      }
      friday {
        slot
        subject {
          name
          code
          type
        }
        teacher {
          name
          code
          email
        }
        room
      }
      thursday {
        slot
        subject {
          name
          code
          type
        }
        teacher {
          name
          code
          email
        }
        room
      }
      tuesday {
        slot
        subject {
          name
          code
          type
        }
        teacher {
          name
          code
          email
        }
        room
      }
      wednesday {
        slot
        subject {
          name
          code
          type
        }
        teacher {
          name
          code
          email
        }
        room
      }
    }
  }
}