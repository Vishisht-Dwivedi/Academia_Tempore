query GetClassroomSchedule($room: String) {
  classroom(room: $room) {
    room
    schedule {
      monday {
        slot
        subject
        teacher
        type
        room
      }
      friday {
        slot
        subject
        teacher
        type
        room
      }
      thursday {
        slot
        subject
        teacher
        type
        room
      }
      tuesday {
        slot
        subject
        teacher
        type
        room
      }
      wednesday {
        slot
        subject
        teacher
        type
        room
      }
    }
  }
}